  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

8px; padding:14px; margin-bottom:11px;\">\n            <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:7px;\">\n              <div style=\"display:flex; align-items:center; gap:8px;\">\n                <div style=\"width:10px; height:10px; border-radius:50%; background:{{ r.color }};\"><\u002Fdiv>\n                <span style=\"font-weight:700; font-size:14px; color:#4a4136;\">{{ r.sevLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"font-size:12px; color:#a8957c; font-weight:600;\">{{ r.when }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;\">\n              <sc-for list=\"{{ r.tags }}\" as=\"tag\" hint-placeholder-count=\"2\">\n                <span style=\"font-size:11.5px; color:#7a6f60; background:#f1ece1; padding:3px 9px; border-radius:999px;\">{{ tag }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size:12.5px; color:#8a7e6c; line-height:1.4;\">{{ r.note }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <!-- BOTTOM NAV -->\n  <div style=\"flex-shrink:0; background:#fbf7ef; border-top:1px solid #ece2d2; display:flex; padding:7px 8px calc(9px + env(safe-area-inset-bottom));\">\n    <sc-for list=\"{{ tabs }}\" as=\"tab\" hint-placeholder-count=\"4\">\n      <div onclick=\"{{ tab.onClick }}\" style=\"flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; padding:6px 0;\">\n        <div style=\"width:50px; height:28px; border-radius:999px; background:{{ tab.pillBg }}; display:flex; align-items:center; justify-content:center;\">\n          <div style=\"width:14px; height:14px; border-radius:{{ tab.dotRadius }}; background:{{ tab.dotColor }};\"><\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-size:11px; font-weight:{{ tab.weight }}; color:{{ tab.labelColor ck.kcal + ' kcal', dot: '#7e9469', bg: '#fffdf8', border: '#ece2d2', tag: 'recept ›', tagColor: '#be7355', onClick: () => this.openRecipe('snack') },\n      { time: mealTime('dinner') + ' · VEČERA', title: plan.dinner.title, sub: 'tolerancia ' + plan.dinner.tol + ' · ' + plan.dinner.kcal + ' kcal', dot: '#7e9469', bg: '#fffdf8', border: '#ece2d2', tag: 'recept ›', tagColor: '#be7355', onClick: () => this.openRecipe('dinner') },\n    ];\n\n    const totalKcal = this.mealOrder.reduce((sum, k) => sum + plan[k].kcal, 0);\n\n    // supplements for the selected day\n    const dayTaken = s.suppsByDay[key] || {};\n    const supps = this.suppTemplate.map(x => {\n      const taken = !!dayTaken[x.id];\n      return {\n        ...x, taken,\n        onToggle: () => this.toggleSupp(x.id),\n        cardBg: taken ? '#eef1e8' : '#fffdf8',\n        cardBorder: taken ? '#d6e0c6' : '#ece2d2',\n        iconBg: x.abbr === 'DAO' ? '#f1e0d6' : '#e9efe0',\n        iconColor: x.abbr === 'DAO' ? '#be7355' : '#7e9469',\n        check: taken ? '✓' : '',\n        checkBg: taken ? '#7e9469' : 'transparent',\n        checkBorder: taken ? '#7e9469' : '#d8ccb8',\n      };\n    });\n    const takenCount = supps.filter(x => x.taken).length;\n    const total = supps.length;\n    const frac = takenCount / total;\n    const ringEl = R('svg', { width: 54, height: 54, viewBox: '0 0 54 54' },\n      R('circle', { cx: 27, cy: 27, r: 22, fill: 'none', stroke: 'rgba(255,255,255,.25)', strokeWidth: 5 }),\n      R('circle', { cx: 27, cy: 27, r: 22, fill: 'none', stroke: '#f6ece2', strokeWidth: 5, strokeLinecap: 'round', strokeDasharray: 2 * Math.PI * 22, strokeDashoffset: 2 * Math.PI * 22 * (1 - frac), transform: 'rotate(-90 27 27)' }),\n      R('text', { x: 27, y: 32, textAnchor: 'middle', fontSize: 16, fontWeight: 800, fill: '#fff', fontFamily: 'Nunito Sans' }, String(takenCount))\n    );\n\n    // mood for selected day\n    const curMood = s.moodByDay[key] || 0;\n    const moodLabels = ['Náročný', 'Slabší', 'Neutrálny', 'Dobrý', 'Skvelý'];\n    const moodRow = R('div', { style: { display: 'flex', gap: 6 } },\n      moodLabels.map((lbl, i) => {\n        const val = i + 1;\n        const active = curMood === val;\n        return R('div', {\n          key: val, onClick: () => this.setMood(val),\n          style: {\n            flex: 1, textAlign: 'center', padding: '9px 2px', borderRadius: 12, cursor: 'pointer',\n            background: active ? '#be7355' : '#f3ede2', color: active ? '#fff' : '#8a7e6c',\n            fontWeight: active ? 800 : 600, fontSize: 11.5, lineHeight: 1.1,\n            border: active ? '1px solid #be7355' : '1px solid #ece2d2',\n          },\n        }, lbl);\n      })\n    );\n\n    const severityRow = R('div', { style: { display: 'flex', gap: 8 } },\n      [1, 2, 3].map(sev => {\n        const active = s.draftSeverity === sev;\n        const col = this.sevColor(sev);\n        return R('div', {\n          key: sev, onClick: () => this.setState({ draftSeverity: sev }),\n          style: {\n            flex: 1, textAlign: 'center', padding: '11px 4px', borderRadius: 13, cursor: 'pointer',\n            background: active ? col : '#f3ede2', color: active ? '#fff' : '#8a7e6c',\n            fontWeight: 700, fontSize: 13, border: active ? '1px solid ' + col : '1px solid #ece2d2',\n          },\n        }, this.sevLabel(sev));\n      })\n    );\n\n    const symptomChips = R('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 8 } },\n      this.symptomOptions.map(opt => {\n        const active = s.draftSymptoms.includes(opt);\n        return R('div', {\n          key: opt, onClick: () => this.toggleSymptom(opt),\n          style: {\n            padding: '8px 13px', borderRadius: 999, cursor: 'pointer', fontSize: 12.5, fontWeight: 600,\n            background: active ? '#f3e0d6' : '#f3ede2', color: active ? '#a85c40' : '#8a7e6c',\n            border: active ? '1px solid #d9b79e' : '1px solid #ece2d2',\n          },\n        }, opt);\n      })\n    );\n\n    const triggerInput = R('input', {\n      value: s.draftTrigger,\n      onChange: (e) => this.setState({ draftTrigger: e.target.value }),\n      placeholder: 'napr. zrejúci syr, paradajky, víno…',\n      style: {\n        width: '100%', boxSizing: 'border-box', padding: '12px 14px', borderRadius: 13,\n        border: '1px solid #ece2d2', background: '#faf6ef', fontSize: 13.5, color: '#4a4136',\n        fontFamily: 'Nunito Sans, sans-serif', outline: 'none',\n      },\n    });\n\n    const reactions = s.reactions.map(r => ({\n      ...r, color: this.sevColor(r.severity), sevLabel: this.sevLabel(r.severity) + ' reakcia', when: this.relWhen(r.ts || r.id),\n    }));\n\n    // streak: days since last reaction\n    let streakValue = '–';\n    if (s.reactions.length) {\n      const last = Math.max(...s.reactions.map(r => r.ts || r.id));\n      const a = new Date(last); a.setHours(0, 0, 0, 0);\n      const b = new Date(); b.setHours(0, 0, 0, 0);\n      streakValue = String(Math.max(0, Math.round((b - a) / 86400000)));\n    }\n\n    const tabDefs = [\n      { id: 'home', label: 'Domov', match: ['home'] },\n      { id: 'plan', label: 'Plán', match: ['plan', 'recipe'] },\n      { id: 'supps', label: 'Doplnky', match: ['supps'] },\n      { id: 'diary', label: 'Denník', match: ['diary'] },\n    ];\n    const tabs = tabDefs.map(t => {\n      const active = t.match.includes(s.screen);\n      return {\n        label: t.label, onClick: () => this.go(t.id),\n        pillBg: active ? '#f1ddd0' : 'transparent',\n        dotColor: active ? '#be7355' : '#bcae9a',\n        dotRadius: active ? '4px' : '50%',\n        labelColor: active ? '#a85c40' : '#a8957c',\n        weight: active ? 800 : 600,\n      };\n    });\n\n    const r = plan[s.recipeKey];\n    const wdFull = this.weekdaysFull[di];\n    const dLabel = this.dateLabel(curD);\n\n    return {\n      weekChips,\n      dayLine: dLabel,\n      bigTitle: isToday ? this.greeting() : wdFull,\n      planSub: wdFull + ' ' + dLabel + ' · čerstvé suroviny, ~' + totalKcal + ' kcal',\n      suppSub: wdFull + ' ' + dLabel + ' · podpora rozkladu histamínu',\n      streakValue,\n      meals, timeline, supps, tabs, reactions,\n      diaryEmpty: s.reactions.length === 0,\n      moodRow, severityRow, symptomChips, triggerInput, suppRing: ringEl,\n      suppDoneLabel: takenCount + ' z ' + total,\n      isHome: s.screen === 'home',\n      isPlan: s.screen === 'plan',\n      isRecipe: s.screen === 'recipe',\n      isSupps: s.screen === 'supps',\n      isDiary: s.screen === 'diary',\n      recipe: r,\n      showForm: s.showForm,\n      formToggleIcon: s.showForm ? '×' : '+',\n      toggleForm: () => this.setState(st => ({ showForm: !st.showForm })),\n      addReaction: () => this.addReaction(),\n      goDiary: () => this.go('diary'),\n      goPlan: () => this.go('plan'),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
