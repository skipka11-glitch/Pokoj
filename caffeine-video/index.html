<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Caffeine Trick</title>
<style>
  @font-face { font-family: Inter; font-weight: 400; src: url(fonts/inter-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: Inter; font-weight: 600; src: url(fonts/inter-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: Inter; font-weight: 800; src: url(fonts/inter-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: JBM; font-weight: 400; src: url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: JBM; font-weight: 600; src: url(fonts/jetbrains-mono-latin-600-normal.woff2) format('woff2'); }

  :root {
    --amber: #ffb347;
    --violet: #a58bff;
    --red: #ff4d5e;
    --teal: #3fe0c5;
    --ink: #f4f1ea;
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font-family: Inter, system-ui, sans-serif; color: var(--ink); }

  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 50% 50%; background: #000; }
  #gl { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
  .layer { position: absolute; inset: 0; pointer-events: none; }

  /* cinematic finishing */
  #vignette { background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
  #grain { opacity: .07; mix-blend-mode: overlay; background-size: 256px 256px; }
  #flash { background: #fff; opacity: 0; }
  #fade { background: #000; opacity: 0; }
  #dim { opacity: 0; background: linear-gradient(90deg, rgba(0,0,0,.9) 0%, rgba(0,0,0,.6) 45%, rgba(0,0,0,0) 75%); }
  .bar { position: absolute; left: 0; right: 0; height: 96px; background: #000; }
  #barTop { top: 0; } #barBot { bottom: 0; }

  /* chapter tag */
  #chapter { position: absolute; left: 96px; top: 132px; font: 600 22px/1 JBM, monospace; letter-spacing: .18em; color: rgba(244,241,234,.85); display: flex; gap: 18px; align-items: center; }
  #chapter i { display: block; width: 44px; height: 2px; background: var(--amber); }

  #clock { position: absolute; right: 110px; top: 128px; font: 600 54px/1 JBM, monospace; color: #ff6b3d; text-shadow: 0 0 18px rgba(255,90,40,.7); letter-spacing: .04em; }

  /* subtitle / caption */
  #caption { position: absolute; left: 0; right: 0; bottom: 150px; text-align: center; font: 600 40px/1.3 Inter, sans-serif; text-shadow: 0 2px 18px rgba(0,0,0,.85); padding: 0 220px; }
  #caption em { font-style: normal; color: var(--amber); }
  #caption b { font-weight: 800; color: var(--violet); }

  /* 3D-anchored tags */
  .tag { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .tag .dot { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; background: var(--c); box-shadow: 0 0 22px var(--c), 0 0 4px #fff inset; }
  .tag .ring { position: absolute; left: -22px; top: -22px; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--c); }
  .tag .line { position: absolute; left: 0; top: 0; height: 2px; background: var(--c); transform-origin: 0 50%; box-shadow: 0 0 10px var(--c); }
  .tag .box { position: absolute; white-space: nowrap; }
  .tag .title { font: 800 46px/1 Inter, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #fff; text-shadow: 0 0 24px var(--c), 0 2px 10px rgba(0,0,0,.8); }
  .tag .sub { margin-top: 10px; font: 400 25px/1.25 Inter, sans-serif; color: rgba(255,255,255,.88); text-shadow: 0 2px 10px rgba(0,0,0,.9); }
  .tag .chip { display: inline-block; margin-bottom: 10px; padding: 5px 10px; border: 1.5px solid var(--c); color: var(--c); font: 600 17px/1 JBM, monospace; letter-spacing: .14em; border-radius: 4px; background: rgba(0,0,0,.35); }

  /* adenosine meter */
  #meter { position: absolute; right: 96px; top: 120px; width: 380px; padding: 20px 22px; border-radius: 14px; background: rgba(10,8,30,.55); border: 1.5px solid rgba(165,139,255,.5); backdrop-filter: blur(6px); }
  #meter .k { font: 600 17px/1 JBM, monospace; letter-spacing: .16em; color: var(--violet); }
  #meter .track { margin-top: 14px; height: 14px; border-radius: 7px; background: rgba(255,255,255,.1); overflow: hidden; }
  #meter .fill { height: 100%; width: 30%; border-radius: 7px; background: linear-gradient(90deg, #6d5cff, #c58bff); box-shadow: 0 0 16px #a58bff; }
  #meter .v { margin-top: 12px; font: 400 22px/1.2 Inter, sans-serif; color: rgba(255,255,255,.9); }
  #meter .v b { color: var(--violet); }

  /* takeaway */
  #takeaway { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; padding-left: 130px; }
  #takeaway .l1, #takeaway .l2 { font: 800 82px/1.08 Inter, sans-serif; letter-spacing: -.01em; text-shadow: 0 4px 40px rgba(0,0,0,.75); }
  #takeaway .l2 { margin-top: 8px; }
  #takeaway .w { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }
  #takeaway .hl { position: relative; color: var(--amber); }
  #takeaway .ul { position: absolute; left: 0; bottom: -6px; height: 8px; width: 100%; background: var(--amber); transform-origin: 0 50%; box-shadow: 0 0 24px var(--amber); border-radius: 4px; }
  #takeaway .sub { margin-top: 44px; max-width: 980px; font: 400 32px/1.4 Inter, sans-serif; color: rgba(255,255,255,.9); text-shadow: 0 2px 16px rgba(0,0,0,.9); }
  #takeaway .sub b { color: var(--violet); font-weight: 600; }
  #takeaway .kicker { margin-bottom: 26px; font: 600 22px/1 JBM, monospace; letter-spacing: .2em; color: var(--amber); }

  /* live-mode controls (hidden while rendering) */
  #ui { position: fixed; left: 0; right: 0; bottom: 0; height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: linear-gradient(transparent, rgba(0,0,0,.7)); font: 13px/1 Inter, sans-serif; color: #ccc; }
  #ui button { background: none; border: 1px solid #666; color: #eee; border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
  #scrub { flex: 1; height: 6px; background: #333; border-radius: 3px; position: relative; cursor: pointer; }
  #scrub div { position: absolute; left: 0; top: 0; bottom: 0; background: var(--amber); border-radius: 3px; }
  .render #ui { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div class="layer" id="tags"></div>
  <div class="layer" id="vignette"></div>
  <div class="layer" id="dim"></div>
  <div class="layer" id="text">
    <div id="chapter"><i></i><span></span></div>
    <div id="clock">11:47 PM</div>
    <div id="caption"></div>
    <div id="meter">
      <div class="k">ADENOSINE LEVEL</div>
      <div class="track"><div class="fill"></div></div>
      <div class="v">Still building up <b>&uarr;</b> &mdash; just unheard</div>
    </div>
    <div id="takeaway">
      <div class="kicker">THE KEY TAKEAWAY</div>
      <div class="l1"></div>
      <div class="l2"></div>
      <div class="sub">Adenosine keeps piling up behind the blocked receptors. When the caffeine wears off, it all docks at once &mdash; <b>that's the crash.</b></div>
    </div>
  </div>
  <div class="bar" id="barTop"></div><div class="bar" id="barBot"></div>
  <div class="layer" id="grain"></div>
  <div class="layer" id="fade"></div>
  <div class="layer" id="flash"></div>
</div>
<div id="ui"><button id="play">Pause</button><div id="scrub"><div></div></div><span id="time">0.0s</span></div>
<script type="module" src="scene.js"></script>
</body>
</html>
